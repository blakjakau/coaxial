<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Plate -->
  <rect width="512" height="512" rx="112" fill="#0c0e12" />
  
  <g fill="none" stroke="currentColor" stroke-linecap="round" color="#f8fafc">
    <!-- Outer Shield Orbit (Origin: 270, 256; Radius: 160; 45° to 315°) -->
